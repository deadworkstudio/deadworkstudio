<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>DEADWORK - Stock Shredder</title>
<!-- Short share link for the SHRED trial (docs/superpowers/specs/2026-10-26-shred-trial-design.md,
     §6.1): deadworkstudio.com/stock-shredder/?code=SHRED redirects straight to the real product
     page's pricing section with the query string (and the code in it) carried along. -->
<!-- 2026-11-17: someone who just types deadworkstudio.com/stock-shredder should land at the TOP of
     the product page, not scrolled down to the trial box. Only a link that carries a code
     (?code=SHRED) jumps to #trial; everything else opens at the top. -->
<script>
  var hasCode = /[?&]code=/i.test(location.search);
  // Keep where the visitor came from for ss-funnel.js on the product page (trial signups 2026-11-19).
  try { if (document.referrer && new URL(document.referrer).hostname !== location.hostname) sessionStorage.setItem('dw-ref', document.referrer.slice(0, 300)); } catch (e) {}
  location.replace('../products/stock-shredder/' + location.search + (hasCode ? '#trial' : ''));
</script>
</head>
<body>
<noscript>
  <!-- L11 (2026-10-26 QA): this whole page exists only as the SHRED share link (see the comment
       above) — a script-disabled browser can't read location.search to forward an arbitrary
       code, but since the code here is always SHRED, hardcoding it keeps the fallback link
       working the same as the JS redirect instead of silently dropping the trial. -->
  <p><a href="../products/stock-shredder/?code=SHRED#trial">Continue to Stock Shredder</a></p>
</noscript>
<script src="/assets/js/ss-funnel.js?v=20261119a" defer></script>
</body>
</html>
