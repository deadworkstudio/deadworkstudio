<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>DEADWORK - Stock Shredder</title>
<!-- Short share link for the SHRED trial (docs/superpowers/specs/2026-10-26-shred-trial-design.md,
     §6.1): deadworkstudio.com/stock-shredder/?code=SHRED redirects straight to the real product
     page's pricing section with the query string (and the code in it) carried along. -->
<script>
  location.replace('../products/stock-shredder/' + location.search + '#trial');
</script>
</head>
<body>
<noscript>
  <!-- L11 (2026-10-26 QA): this whole page exists only as the SHRED share link (see the comment
       above) — a script-disabled browser can't read location.search to forward an arbitrary
       code, but since the code here is always SHRED, hardcoding it keeps the fallback link
       working the same as the JS redirect instead of silently dropping the trial. -->
  <p><a href="../products/stock-shredder/?code=SHRED#trial">Continue to Stock Shredder</a></p>
</noscript>
</body>
</html>
