<!doctype html>
<html lang="en" data-product="{{product}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F4F1EA" />
{{robots}}
<title>{{seo_title}} | DEADWORK</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{url}}" />
<meta property="og:type" content="article" />
<meta property="og:url" content="{{url}}" />
<meta property="og:title" content="{{seo_title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:image" content="{{og_image}}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:site_name" content="DEADWORK" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{seo_title}}" />
<meta name="twitter:description" content="{{description}}" />
<meta name="twitter:image" content="{{og_image}}" />
<link rel="icon" href="../../assets/img/brand/favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="../../assets/img/brand/apple-touch-icon.png" />
<link rel="preload" href="../../assets/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="../../assets/css/buttons.css?v=20261027a" />
<link rel="stylesheet" href="../../assets/css/ss-page.css?v=20261109e" />
<link rel="stylesheet" href="../../assets/css/nav-v2.css?v=20261027a" />
<link rel="stylesheet" href="../../assets/css/guide.css?v={{css_v}}" />
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "d02ee5ff4dd84531b48aa1da2c7b63a9"}'></script><!-- End Cloudflare Web Analytics -->
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="ss guide">
<a class="skip" href="#main">Skip to content</a>

{{header}}

<main id="main" class="g-main">
  <article class="g-article">
    <header class="g-head">
      <p class="mono g-eyebrow">{{eyebrow}}</p>
      <h1 class="g-title">{{title}}</h1>
      <p class="g-dek">{{dek}}</p>
      <p class="mono g-byline">DEADWORK STUDIO <span aria-hidden="true">&middot;</span> {{updated_human}} <span aria-hidden="true">&middot;</span> {{read_minutes}} MIN READ</p>
      <p class="g-head-cta"><a class="pill pill-solid" href="{{cta_href}}" data-cta="top">{{cta_label}}</a></p>
    </header>

    <div class="g-body">
{{body}}
    </div>

    <aside class="g-cta" aria-label="{{cta_label}}">
      <p class="mono">{{cta_eyebrow}}</p>
      <h2>{{cta_title}}</h2>
      <p>{{cta_text}}</p>
      <p><a class="pill pill-solid" href="{{cta_href}}" data-cta="end">{{cta_label}}</a></p>
      <p class="g-cta-note">{{cta_note}}</p>
    </aside>

    <section class="g-faq" aria-labelledby="faq">
      <h2 id="faq">FAQ</h2>
{{faq_html}}
    </section>
  </article>
</main>

{{footer}}

<script src="../../assets/js/nav-dropdown.js?v=20261025b"></script>
<script src="/assets/js/ss-funnel.js?v=20261119a" defer></script>
</body>
</html>
