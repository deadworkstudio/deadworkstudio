<meta charset="UTF-8" />

<title>DEADWORK — About</title>
<meta http-equiv="refresh" content="0; url=../studio/#mission" />
<link rel="canonical" href="https://deadworkstudio.com/studio/#mission" />
<!-- D-9: this used to round-trip through /mission/ (itself just another redirect to
     /studio/#mission), a needless extra hop + request; point straight at the real destination.
     /about/#contact was a real deep link (the old in-page Contact panel, now its own section) —
     keep sending that one to #contact instead. Query must precede the hash (path?query#hash) in
     both branches, or the query string gets swallowed into the hash and lost. -->
<script>
  if (location.hash === '#contact') location.replace('../studio/' + location.search + '#contact');
  else location.replace('../studio/' + location.search + '#mission');
</script>
